# ArvisX pilot broker (Eclipse Mosquitto 2.x).
# Sensors/gateways publish device telemetry here; the ArvisX API subscribes.
#
# SECURITY: this default allows anonymous connections, which is acceptable ONLY
# on an isolated building LAN / private Docker network. For any networked or
# internet-reachable pilot, set `allow_anonymous false` and add a password file
# (see DEPLOY.md → "Securing the broker"). Never expose 1883 to the public.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type notice
connection_messages true
