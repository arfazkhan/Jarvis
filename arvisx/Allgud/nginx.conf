# SPA serving for AllGud — falls back to index.html so react-router deep links
# (e.g. /field/run/42 from a WhatsApp message) resolve client-side.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # static assets — long cache (hashed filenames)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
