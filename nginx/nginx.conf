# ═══════════════════════════════════════════════════════════════════════════════
# ARVIS Ops Copilot - Nginx Reverse Proxy Configuration
# ═══════════════════════════════════════════════════════════════════════════════

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Upstream - ARVIS API
    upstream arvis_api {
        server arvis-api:8000;
        keepalive 32;
    }

    # ══════════════════════════════════════════════════════════════════════════
    # HTTP - Redirect to HTTPS (Production)
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # Health check endpoint (no redirect)
        location /health {
            proxy_pass http://arvis_api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # HTTPS - Main Application
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        # Client body size
        client_max_body_size 10M;

        # ═══════════════════════════════════════════════════════════════════════
        # Health Check (No Auth)
        # ═══════════════════════════════════════════════════════════════════════
        location /health {
            proxy_pass http://arvis_api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # ═══════════════════════════════════════════════════════════════════════
        # API Endpoints
        # ═══════════════════════════════════════════════════════════════════════
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://arvis_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ═══════════════════════════════════════════════════════════════════════
        # WebSocket Support (Voice, Real-time updates)
        # ═══════════════════════════════════════════════════════════════════════
        location /ws/ {
            proxy_pass http://arvis_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeouts
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # ═══════════════════════════════════════════════════════════════════════
        # SSE (Server-Sent Events)
        # ═══════════════════════════════════════════════════════════════════════
        location /events/ {
            proxy_pass http://arvis_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Accel-Buffering "no";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # ═══════════════════════════════════════════════════════════════════════
        # Prometheus Metrics (Internal only)
        # ═══════════════════════════════════════════════════════════════════════
        location /metrics {
            # Allow only internal network
            allow 172.28.0.0/16;
            allow 127.0.0.1;
            deny all;

            proxy_pass http://arvis-api:9090/metrics;
        }

        # ═══════════════════════════════════════════════════════════════════════
        # Root
        # ═══════════════════════════════════════════════════════════════════════
        location / {
            proxy_pass http://arvis_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
