# ═══════════════════════════════════════════════════════════════════════════════
# ARVIS — on-prem live building (BACnet/IP) deployment
# ═══════════════════════════════════════════════════════════════════════════════
# Usage (on the edge host on the BMS LAN, Linux):
#   docker compose -f docker-compose.site.yml up -d
#
# Host networking is required: BACnet discovery uses UDP broadcast (Who-Is /
# I-Am on 47808), which does not cross Docker's bridge network. That is why
# this is a separate file rather than an override of docker-compose.yml, whose
# services talk to each other by bridge-network service names.
#
# Host networking also means every port binds on every interface — including the
# BMS LAN. So the API listens on loopback only, and the sole way in is the nginx
# TLS proxy on the management interface (ARVIS_MGMT_IP). Apply the host firewall
# too: deploy/site/firewall.sh.
#
# Required env (e.g. in .env next to this file):
#   ARVIS_AUTH_SECRET, ARVIS_ADMIN_PASSWORD   — API auth (fails closed without)
#   ARVIS_MGMT_IP                             — management-network IP of this box
#                                               (operators reach https://<it>)
#   ARVIS_EGRESS_ALLOW                        — hosts the site approved for outbound
#                                               traffic, e.g. the LLM endpoint. Empty
#                                               = nothing leaves the LAN (rules engine
#                                               still runs; LLM features degrade).
#   GROQ_API_KEY (and/or OPENAI_API_KEY)      — LLM layer (degrades without)
#
# WhatsApp engineer (optional): add the gateway file —
#   docker compose -f docker-compose.site.yml -f docker-compose.whatsapp.yml up -d
#   EVOLUTION_IMAGE                           — pin it, e.g. evoapicloud/evolution-api:<version>
#                                               (check Docker Hub; ARVIS was built against 2.3.x)
#   EVOLUTION_API_KEY, EVOLUTION_DB_PASSWORD  — long random strings
#   ARVIS_EVOLUTION_INSTANCE                  — instance name you create in Evolution
#   ARVIS_EVOLUTION_WEBHOOK_TOKEN             — shared secret on the webhook (long random)
#   ARVIS_PEOPLE                              — "Sara:+974...:fm, Ali:+974...:technician, ..."
#   ARVIS_OPS_GROUP                           — optional: the team's WhatsApp group jid (…@g.us)
#   voice notes are transcribed on this box: fetch the speech model once (needs internet once):
#   docker exec arvis-site python -m agent_commercial.ops_engineer.media prefetch
#   then: create the instance, scan its QR, and run
#   docker exec arvis-site python -m agent_commercial.messaging.evolution set-webhook #       --url http://127.0.0.1:8000/api/v1/evolution/webhook
# Site files:
#   ./site/bms_config.yaml                     — bacnet.points / modbus.registers
#   ./site/commissioning.yaml                  — design facts, zones, roles
#   ./nginx/ssl/cert.pem, key.pem              — TLS certificate for the proxy
# ═══════════════════════════════════════════════════════════════════════════════

services:
  arvis:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: arvis-site
    restart: unless-stopped
    network_mode: host
    environment:
      - ARVIS_ENV=production
      - ARVIS_MODE=${ARVIS_MODE:-bacnet}
      - ARVIS_BMS_CONFIG=/app/site/bms_config.yaml
      - ARVIS_COMMISSIONING_SPEC=/app/site/commissioning.yaml
      - ARVIS_BUILDING_ID=${ARVIS_BUILDING_ID:-default}
      - ARVIS_DB_PATH=/app/data/arvis_bms.db
      - ARVIS_API_HOST=127.0.0.1
      - ARVIS_EGRESS_POLICY=enforce
      - ARVIS_EGRESS_ALLOW=${ARVIS_EGRESS_ALLOW:-}
      - ARVIS_AUTH_SECRET=${ARVIS_AUTH_SECRET}
      - ARVIS_ADMIN_PASSWORD=${ARVIS_ADMIN_PASSWORD}
      - ARVIS_OPERATOR_PASSWORD=${ARVIS_OPERATOR_PASSWORD:-}
      # OPC UA (ARVIS_MODE=opcua): give ARVIS a read-only user on the server
      - ARVIS_OPCUA_USERNAME=${ARVIS_OPCUA_USERNAME:-}
      - ARVIS_OPCUA_PASSWORD=${ARVIS_OPCUA_PASSWORD:-}
      # WhatsApp engineer — off unless the Evolution settings and the roster are set
      - ARVIS_EVOLUTION_URL=${ARVIS_EVOLUTION_URL:-http://127.0.0.1:8080}
      - ARVIS_EVOLUTION_INSTANCE=${ARVIS_EVOLUTION_INSTANCE:-}
      - ARVIS_EVOLUTION_APIKEY=${EVOLUTION_API_KEY:-}
      - ARVIS_EVOLUTION_WEBHOOK_TOKEN=${ARVIS_EVOLUTION_WEBHOOK_TOKEN:-}
      - ARVIS_PEOPLE=${ARVIS_PEOPLE:-}
      - ARVIS_FIELD_TECHNICIANS=${ARVIS_FIELD_TECHNICIANS:-}
      - ARVIS_BUILDING_NAME=${ARVIS_BUILDING_NAME:-}
      - ARVIS_TZ=${ARVIS_TZ:-Asia/Qatar}
      - ARVIS_OPS_QUIET_HOURS=${ARVIS_OPS_QUIET_HOURS:-22-6}
      - ARVIS_OPS_BRIEF_HOUR=${ARVIS_OPS_BRIEF_HOUR:-7}
      - ARVIS_OPS_OWNER_BRIEF_DAY=${ARVIS_OPS_OWNER_BRIEF_DAY:-Sunday}
      - ARVIS_OPS_OWNER_COST=${ARVIS_OPS_OWNER_COST:-1000}
      - ARVIS_OPS_MAX_PER_HOUR=${ARVIS_OPS_MAX_PER_HOUR:-4}
      - ARVIS_OPS_GROUP=${ARVIS_OPS_GROUP:-}
      - ARVIS_OPS_JUDGE=${ARVIS_OPS_JUDGE:-rule}
      - ARVIS_DECISION_URL=${ARVIS_DECISION_URL:-}
      - ARVIS_STT_MODEL=${ARVIS_STT_MODEL:-small}
      - ARVIS_STT_MODEL_DIR=/app/data/models/whisper
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./site:/app/site:ro
      - arvis-site-data:/app/data
      - arvis-site-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # The only way in: TLS on the management interface, rate-limited login.
  proxy:
    image: nginx:1.27-alpine
    container_name: arvis-site-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      - ARVIS_MGMT_IP=${ARVIS_MGMT_IP:?set ARVIS_MGMT_IP to this box's management-network IP}
    volumes:
      - ./nginx/site.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - arvis

volumes:
  arvis-site-data:
    driver: local
  arvis-site-logs:
    driver: local
