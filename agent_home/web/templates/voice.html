<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARVIS Voice Control</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        
        .header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(0,0,0,0.2);
        }
        
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .status {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .status.connected { background: #10b981; color: white; }
        .status.disconnected { background: #ef4444; color: white; }
        .status.connecting { background: #f59e0b; color: white; }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .card h2 {
            color: #00d4ff;
            margin-bottom: 16px;
            font-size: 1.2rem;
        }
        
        .voice-input {
            display: flex;
            gap: 12px;
        }
        
        .voice-input input {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
        }
        
        .voice-input input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .voice-input input:focus {
            outline: 2px solid #00d4ff;
        }
        
        button {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,212,255,0.3);
        }
        
        .quick-commands {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }
        
        .quick-btn {
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        .quick-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: #00d4ff;
        }
        
        .log-container {
            max-height: 400px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        
        .log-entry {
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 3px solid;
        }
        
        .log-entry.sent { 
            border-color: #00d4ff; 
            background: rgba(0,212,255,0.1);
        }
        .log-entry.received { 
            border-color: #10b981; 
            background: rgba(16,185,129,0.1);
        }
        .log-entry.error { 
            border-color: #ef4444; 
            background: rgba(239,68,68,0.1);
        }
        
        .log-time {
            color: #888;
            font-size: 0.75rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        
        .stat-item {
            text-align: center;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4ff;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 ARVIS Voice Control</h1>
        <span id="status" class="status connecting">Connecting...</span>
    </div>
    
    <div class="container">
        <!-- Voice Input -->
        <div class="card">
            <h2>Send Command</h2>
            <div class="voice-input">
                <input type="text" id="command" placeholder="Type a command... (e.g., 'turn on kitchen light')" 
                       onkeypress="if(event.key==='Enter') sendCommand()">
                <button class="btn-primary" onclick="sendCommand()">Send</button>
            </div>
        </div>
        
        <!-- Quick Commands -->
        <div class="card">
            <h2>Quick Commands</h2>
            <div class="quick-commands">
                <button class="quick-btn" onclick="quickCmd('turn on kitchen light')">🔆 Kitchen On</button>
                <button class="quick-btn" onclick="quickCmd('turn off kitchen light')">⚫ Kitchen Off</button>
                <button class="quick-btn" onclick="quickCmd('turn on bedroom lamp')">💡 Bedroom Lamp On</button>
                <button class="quick-btn" onclick="quickCmd('turn off bedroom lamp')">🌙 Bedroom Lamp Off</button>
                <button class="quick-btn" onclick="quickCmd('turn on porch light')">🏠 Porch On</button>
                <button class="quick-btn" onclick="quickCmd('turn on living room light')">🛋️ Living Room On</button>
                <button class="quick-btn" onclick="quickCmd('turn off all lights')">🌑 All Off</button>
                <button class="quick-btn" onclick="socket.emit('get_stats')">📊 Get Stats</button>
            </div>
        </div>
        
        <!-- Stats -->
        <div class="card">
            <h2>System Stats</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="stat-clients">-</div>
                    <div class="stat-label">Connected Clients</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-patterns">-</div>
                    <div class="stat-label">Learned Patterns</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-aliases">-</div>
                    <div class="stat-label">Learned Aliases</div>
                </div>
            </div>
        </div>
        
        <!-- Event Log -->
        <div class="card">
            <h2>Event Log</h2>
            <div class="log-container" id="log"></div>
        </div>
    </div>
    
    <script>
        const socket = io();
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        
        function log(type, message) {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="log-time">${time}</span> ${message}`;
            logEl.insertBefore(entry, logEl.firstChild);
            
            // Keep only last 50 entries
            while (logEl.children.length > 50) {
                logEl.removeChild(logEl.lastChild);
            }
        }
        
        function setStatus(status) {
            statusEl.className = `status ${status}`;
            statusEl.textContent = status === 'connected' ? '● Connected' : 
                                   status === 'disconnected' ? '● Disconnected' : '● Connecting...';
        }
        
        // Connection events
        socket.on('connect', () => {
            setStatus('connected');
            log('received', '✅ Connected to ARVIS');
        });
        
        socket.on('disconnect', () => {
            setStatus('disconnected');
            log('error', '❌ Disconnected from ARVIS');
        });
        
        socket.on('connected', (data) => {
            log('received', `🔗 Session: ${data.client_id}`);
        });
        
        // ARVIS events
        socket.on('command_received', (data) => {
            log('received', `📥 Processing: "${data.text || data.device_id}"`);
        });
        
        socket.on('command_result', (data) => {
            log('received', `✅ Result: ${data.message} (source: ${data.source})`);
        });
        
        socket.on('tool_calls', (data) => {
            const calls = data.calls.map(c => `${c.tool}(${JSON.stringify(c.args)})`).join(', ');
            log('received', `🔧 Tools: ${calls}`);
        });
        
        socket.on('device_state_update', (data) => {
            log('received', `📱 Device: ${JSON.stringify(data)}`);
        });
        
        socket.on('stats', (data) => {
            log('received', `📊 Stats received`);
            document.getElementById('stat-clients').textContent = data.connected_clients || '-';
            if (data.alias_resolver) {
                document.getElementById('stat-patterns').textContent = data.alias_resolver.learned_aliases || '-';
                document.getElementById('stat-aliases').textContent = data.alias_resolver.user_aliases || '-';
            }
        });
        
        socket.on('alias_taught', (data) => {
            if (data.success) {
                log('received', `📝 Alias taught: "${data.alias}" → ${data.device_id}`);
            } else {
                log('error', `❌ Failed to teach alias`);
            }
        });
        
        socket.on('error', (data) => {
            log('error', `❌ Error: ${data.message}`);
        });
        
        // Send command
        function sendCommand() {
            const input = document.getElementById('command');
            const text = input.value.trim();
            if (!text) return;
            
            log('sent', `📤 Sending: "${text}"`);
            socket.emit('voice_command', { text: text });
            input.value = '';
        }
        
        function quickCmd(cmd) {
            document.getElementById('command').value = cmd;
            sendCommand();
        }
        
        // Initial stats fetch
        setTimeout(() => socket.emit('get_stats'), 1000);
    </script>
</body>
</html>
