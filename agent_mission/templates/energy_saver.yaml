mission_id: energy_saver
mission_type: energy_saver

goals:
  - reduce_energy_consumption
  - auto_disable_idle_devices
  - optimize_away_mode

plan_template:
  - step_id: detect_idle_devices
    step_type: collection
    parameters:
      device_types: ["lights", "ac", "appliances"]
      idle_threshold_minutes: 60
    dependencies: []
    timeout: 60

  - step_id: create_away_mode_scene
    step_type: scene
    parameters:
      scene_name: "away_mode"
      turn_off_all_lights: true
      reduce_ac_temp: 2
      disable_unnecessary_devices: true
    dependencies: []
    timeout: 30

  - step_id: turn_off_idle_devices
    step_type: action
    parameters:
      device_list: "from_detect_idle_devices"
      confirmation_required: false
    dependencies: [detect_idle_devices]
    timeout: 30

  - step_id: schedule_night_auto_off
    step_type: automation
    parameters:
      trigger_time: "23:00"
      action: "turn_off_idle_devices"
    dependencies: [turn_off_idle_devices]
    timeout: 30

  - step_id: monitor_energy_usage
    step_type: monitoring
    parameters:
      metrics: ["device_off_time_ratio", "total_energy_trend"]
      evaluation_frequency: "daily"
    dependencies: [schedule_night_auto_off]
    continuous: true

metrics:
  - name: device_off_time_ratio
    target: "> 0.7"
    weight: 0.5

  - name: energy_reduction_percentage
    target: "> 15%"
    weight: 0.5

adaptive_rules:
  - condition: "device_off_ratio < 0.5 for 2 days"
    action: "increase_idle_detection_aggressiveness"
