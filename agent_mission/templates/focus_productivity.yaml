mission_id: focus_productivity
mission_type: focus_productivity

goals:
  - optimize_work_environment
  - reduce_interruptions
  - improve_focus_conditions

plan_template:
  - step_id: analyze_work_patterns
    step_type: collection
    parameters:
      data_types: ["work_hours", "activity", "room_occupancy"]
      duration_days: 3
    dependencies: []
    timeout: 300

  - step_id: create_focus_scene
    step_type: scene
    parameters:
      scene_name: "deep_focus"
      brightness: 100
      temperature: 22
      reduce_noise: true
      do_not_disturb: true
    dependencies: [analyze_work_patterns]
    timeout: 30

  - step_id: schedule_focus_mode
    step_type: automation
    parameters:
      trigger_time: "inferred_work_start_time"
      scene_id: "deep_focus"
      duration_hours: 3
    dependencies: [create_focus_scene]
    timeout: 30

  - step_id: monitor_interruptions
    step_type: monitoring
    parameters:
      metrics: ["interruption_count", "focus_duration"]
      evaluation_frequency: "daily"
    dependencies: [schedule_focus_mode]
    continuous: true

metrics:
  - name: focus_session_count
    target: "> 2 per day"
    weight: 0.5

  - name: interruption_reduction
    target: "< 3 interruptions per session"
    weight: 0.5

adaptive_rules:
  - condition: "interruptions > 5 per day"
    action: "increase_do_not_disturb_strictness"
