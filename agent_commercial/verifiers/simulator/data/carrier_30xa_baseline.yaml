# Carrier AquaForce 30XA Baseline Chiller Curves
# ===============================================
#
# Generic VFD-class DOE-2 bi-quadratic coefficients validated against
# extracted Carrier 30XA AHRI 550/590 ratings.
#
# Patent Application 2, Claim 2 — DOE-2 bi-quadratic CAP-FT + EIR-FT,
#                                 quadratic EIR-FPLR.
#
# SOURCES:
#   - Coefficients: DOE Commercial Reference Buildings VFD-centrifugal baseline
#     (publicly redistributable). Validated against extracted 30XA ratings.
#   - 30XA AHRI ratings: 30xa-7pd.pdf (Carrier Form 30XA-7PD), Table on p.5
#   - Topology + envelope: 30xa-7pd.pdf features section + product datasheet
#
# TRADE-SECRET PARTITION:
#   - This file is the PUBLIC baseline (Apache-2.0 redistributable coefficients).
#   - Carrier-proprietary engineering coefficients (when obtained via NDA)
#     belong in: data/equipment_curves/carrier_30xa_proprietary.yaml
#     (gitignored, encrypted at rest).
#
# REFERENCED BY:
#   - simulator/chiller.py:load_curves()
#   - tests/test_simulator/test_chiller_ahri.py

version: "1.0.0"
schema_version: 1

metadata:
  manufacturer: "Carrier"
  product_line: "AquaForce"
  model_family: "30XA"
  model_size_used_for_validation: "30XA400"
  topology: "rotary_twin_screw_vfd"   # NOT centrifugal — relevant for EIR-FPLR shape
  refrigerant: "R-134a"
  condenser_type: "air_cooled"
  source_document: "30xa-7pd.pdf (Carrier Form 30XA-7PD, 2011)"
  source_doi: null
  coefficient_provenance: "doe_reference_buildings_vfd_centrifugal_baseline"
  coefficient_license: "Apache-2.0 (DOE Commercial Reference Buildings)"

# Design ratings at AHRI 550/590 standard conditions:
#   LWT (Leaving Chilled Water) = 44 F = 6.67 C
#   EDB (Entering Dry-Bulb)     = 95 F = 35 C  (air-cooled)
#   100% PLR
design_point:
  capacity_kw: 1348.0           # 30XA400 AL/CU: 383.6 tons * 3.517 kW/ton
  capacity_tons: 383.6
  power_input_kw: 374.8         # Full-load electrical input
  cop_full_load: 3.1            # EER 10.7 / 3.412
  eer_full_load: 10.7
  cop_iplv: 4.34                # IPLV EER 14.8 / 3.412
  iplv_eer: 14.8
  chwst_design_c: 6.67          # 44 F
  edb_design_c: 35.0            # 95 F (air-cooled condenser entering)
  # NOTE: For air-cooled chillers, the EIR-FT y-variable is condensing
  # temperature, modeled as: T_cond_approx = EDB + condenser_approach_c.
  condenser_approach_c: 10.0    # Typical for air-cooled at design

operating_envelope:
  chwst_min_c: 4.0
  chwst_max_c: 12.0
  edb_min_c: -10.0              # Standard 30XA low-ambient
  edb_max_c: 55.0               # 30XA high-ambient option (Doha class 0B)
  plr_min: 0.10                 # 30XA continuous unloading via slide valves
  plr_max: 1.0

# ============================================================================
# DOE-2 Bi-quadratic Curve Coefficients
# ============================================================================
# Form:  f(x, y) = c0 + c1*x + c2*x^2 + c3*y + c4*y^2 + c5*x*y
#   x = leaving chilled water temperature (C)
#   y = entering condenser fluid temperature (C, or EDB for air-cooled)
#
# Coefficients normalized to evaluate to ~1.0 at design point.
curves:

  # ---- Capacity as Function of Temperature ----
  # Q_avail = Q_design * cap_ft(x, y)
  cap_ft:
    c0:  0.42415       # constant
    c1:  0.04426       # x = T_chw
    c2: -0.00042       # x^2
    c3:  0.00333       # y = T_cond
    c4: -0.00008       # y^2
    c5: -0.00021       # x*y cross-term
    valid_chwst_range_c: [4.0, 12.0]
    valid_cond_range_c: [10.0, 55.0]

  # ---- Energy Input Ratio as Function of Temperature ----
  # EIR_at_T = (1/COP_design) * eir_ft(x, y)
  eir_ft:
    c0:  0.28687
    c1:  0.02390
    c2: -0.00020
    c3:  0.00680
    c4:  0.00030
    c5: -0.00010
    valid_chwst_range_c: [4.0, 12.0]
    valid_cond_range_c: [10.0, 55.0]

  # ---- Energy Input Ratio as Function of Part Load Ratio ----
  # Form:  f(plr) = c0 + c1*plr + c2*plr^2  (cubic c3 reserved, set to 0)
  # EIR_at_PLR = EIR_at_T * eir_fplr(plr)
  #
  # For VFD twin-screw: shape is relatively flat with optimal point ~50-70%.
  eir_fplr:
    c0:  0.04200
    c1:  0.62000
    c2:  0.33800
    c3:  0.0          # cubic term reserved
    valid_plr_range: [0.10, 1.0]

# ============================================================================
# AHRI 550/590 4-Point IPLV Validation Fixtures
# ============================================================================
# IPLV harmonic mean weighting:
#   IPLV = 1 / (0.01/A + 0.42/B + 0.45/C + 0.12/D)
# Where A, B, C, D are kW/ton at 100/75/50/25% PLR.
#
# AHRI air-cooled condenser entering dry-bulb schedule:
#   100%: 95 F (35 C)
#   75%:  80 F (26.7 C)
#   50%:  65 F (18.3 C)
#   25%:  55 F (12.8 C)
#
# All points at LWT = 44 F = 6.67 C, evaporator fouling factor 0.00010.
ahri_validation_points:
  - plr: 1.00
    edb_c: 35.0
    chwst_c: 6.67
    expected_cop: 3.10      # Full-load 30XA400
    tolerance: 0.05         # +/- 5%
  - plr: 0.75
    edb_c: 26.7
    chwst_c: 6.67
    expected_cop_range: [3.8, 4.8]
  - plr: 0.50
    edb_c: 18.3
    chwst_c: 6.67
    expected_cop_range: [4.5, 5.8]
  - plr: 0.25
    edb_c: 12.8
    chwst_c: 6.67
    expected_cop_range: [4.0, 5.5]

# Expected IPLV (composite) — must match published AHRI rating ±10%
ahri_iplv_target:
  expected_cop: 4.34          # IPLV EER 14.8 / 3.412
  tolerance: 0.10
  source: "Carrier Form 30XA-7PD, 30XA400 AL/CU condenser, AHRI ratings table"

# ============================================================================
# ASHRAE 90.1-2022 Compliance Floor
# ============================================================================
# Air-cooled chillers >= 150 tons (30XA400 = 383.6 tons qualifies):
#   Path A: 10.100 EER FL, 14.000 EER IPLV
#   Path B:  9.700 EER FL, 16.100 EER IPLV
ashrae_90_1_compliance:
  category: "air_cooled_ge_150_tons"
  path_a:
    full_load_eer_min: 10.100
    iplv_eer_min: 14.000
  path_b:
    full_load_eer_min: 9.700
    iplv_eer_min: 16.100
  reference: "ASHRAE 90.1-2022 Table 6.8.1-3"

# ============================================================================
# Extracted 30XA AHRI Ratings (other sizes — for cross-validation)
# ============================================================================
# Source: 30xa-7pd.pdf p.5, AL/CU condenser models
ratings_extracted:
  "30XA300":
    tons: 287.5
    capacity_kw: 1010.2
    power_input_kw: 301.2
    full_eer: 10.7
    full_cop: 3.1
    iplv_eer: 14.2
    iplv_cop: 4.16
  "30XA400":
    tons: 383.6
    capacity_kw: 1348.0
    power_input_kw: 374.8
    full_eer: 10.7
    full_cop: 3.1
    iplv_eer: 14.8
    iplv_cop: 4.34
  "30XA500":
    tons: 458.0
    capacity_kw: 1609.4
    power_input_kw: 509.3
    full_eer: 10.6
    full_cop: 3.1
    iplv_eer: 14.3
    iplv_cop: 4.19

# 2x 30XA400 = 767 tons (closest to 800-ton building target)
# 2x 30XA450 = ~853 tons (alternative if 800-ton-strict required)
parallel_plant_recommendation:
  target_tons: 800
  recommended: "2x 30XA400 (767 tons total)"
  alternative: "2x 30XA450 (853 tons total)"
